[project]
name = "ai-recommendation"
version = "0.1.0"
description = "AI recommendations service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.6.1",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "openai>=2.28.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
