name: CineMatch CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. Frontend CI (Angular)
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # TODO: Fix linting errors in frontend
      # - name: Lint
      #   run: npm run lint
      # TODO: Fix unit tests in frontend
      # - name: Test
      #   run: npm test -- --watch=false

  # 2. Gateway CI (Node.js/Prisma)
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gateway_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: gateway
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/gateway_test_db?sslmode=disable
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: gateway_test_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      POSTGRES_CHANNEL_BINDING: disable
      JWT_SECRET: test_secret
      CORE_SERVICE_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Verify Prisma Migrations
        run: npx prisma migrate deploy
      # TODO: Fix linting errors in gateway
      # - name: Lint
      #   run: npm run lint
      - name: Test
        run: npm test

  # 3. Core Service CI (Python/FastAPI/Alembic)
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: core_test_db
        ports:
          - 5433:5432 # Use different port to avoid conflict if running on same runner host (though GHA isolation usually handles this)
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: core
    env:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: core_test_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      TMDB_READ_ACCESS_TOKEN: mock_token
      TMDB_BASE_URL: http://localhost:8080 # Points to nothing by default, forcing failure or relying on internal mocks
      # RabbitMQ
      RABBITMQ_USER: rmq_admin
      RABBITMQ_PASSWORD: rmq_password
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      AI_RECOMMENDATION_QUEUE: ai.search.request
      AI_REVIEW_SUMMARIZER_QUEUE: ai.review.summary.request
      # S3 / MinIO
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: mock
      S3_SECRET_ACCESS_KEY: mock
      S3_BUCKET_NAME: mock
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-path: core/uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Disable SSL for CI
        run: |
          sed -i 's/ssl=require/ssl=disable/g' db/config.py
          sed -i 's/ssl=require/ssl=disable/g' tests/test_config.py
      - name: Create .env file for tests
        run: |
          echo "POSTGRES_USER=test_user" > .env
          echo "POSTGRES_PASSWORD=test_password" >> .env
          echo "POSTGRES_DB=core_test_db" >> .env
          echo "POSTGRES_HOST=localhost" >> .env
          echo "POSTGRES_PORT=5433" >> .env
          echo "RABBITMQ_USER=rmq_admin" >> .env
          echo "RABBITMQ_PASSWORD=rmq_password" >> .env
          echo "RABBITMQ_HOST=localhost" >> .env
          echo "RABBITMQ_PORT=5672" >> .env
          echo "AI_RECOMMENDATION_QUEUE=ai.search.request" >> .env
          echo "AI_REVIEW_SUMMARIZER_QUEUE=ai.review.summary.request" >> .env
          echo "S3_ENDPOINT_URL=http://localhost:9000" >> .env
          echo "S3_ACCESS_KEY_ID=mock" >> .env
          echo "S3_SECRET_ACCESS_KEY=mock" >> .env
          echo "S3_BUCKET_NAME=mock" >> .env
          echo "S3_REGION=us-east-1" >> .env
          echo "TMDB_READ_ACCESS_TOKEN=mock_token" >> .env
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint (Ruff)
        run: uv run ruff check .
      - name: Verify Alembic Migrations
        run: uv run alembic upgrade head
      - name: Test (Pytest)
        run: uv run pytest

  # 4. AI Services CI (Python Workers)
  ai-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [recommendation-ai, review-summary-ai]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-path: ${{ matrix.service }}/uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync


