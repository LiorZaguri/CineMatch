apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinematch-s3
  labels:
    app: cinematch-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cinematch-s3
  template:
    metadata:
      labels:
        app: cinematch-s3
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        ports:
        - containerPort: 9000
        - containerPort: 9001
        env:
        - name: MINIO_ROOT_USER
          value: "minio_admin"
        - name: MINIO_ROOT_PASSWORD
          value: "minio_password"
        volumeMounts:
        - name: s3-data
          mountPath: /data
      volumes:
      - name: s3-data
        persistentVolumeClaim:
          claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: s3-storage
spec:
  type: LoadBalancer
  selector:
    app: cinematch-s3
  ports:
    - name: api
      protocol: TCP
      port: 9000
      targetPort: 9000
    - name: console
      protocol: TCP
      port: 9001
      targetPort: 9001