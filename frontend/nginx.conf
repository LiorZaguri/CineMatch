server {
    listen 80;
    server_name localhost;

    # Gzip Compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. The Angular Frontend (UI)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Essential for Angular routing (Deep linking)
        try_files $uri $uri/ /index.html; 
    }

    # 2. The Gateway Proxy (with Direct Access Protection)
    location /CineMatch {
        # SECURITY: Prevent direct URL access from address bar
        # Only allow requests originating from our own domain
        valid_referers blocked server_names localhost;
        if ($invalid_referer) {
            return 403;
        }

        # PROXY: Forward the request to the internal gateway container
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running AI requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
